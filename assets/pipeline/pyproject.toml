[project]
name = "croquis-assets"
version = "0.1.0"
description = "Pipeline reproducible de assets 3D (cuerpos de MakeHuman CC0 a glTF)"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.5,<3",
  "httpx>=0.28,<1",
  "pillow==12.3.0",
]

[project.scripts]
croquis-assets = "croquis_assets.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_assets"]
