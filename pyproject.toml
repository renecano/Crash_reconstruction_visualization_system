[project]
name = "croquis"
version = "0.1.0"
description = "Espacio de trabajo Python de Croquis: solver y extracción de referencia, datos y evaluación (no se despliega)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "croquis-scene-schema",
  "croquis-solver",
  "croquis-extraction",
  "croquis-data",
  "croquis-eval",
  "croquis-assets",
]

[tool.uv.sources]
croquis-scene-schema = { workspace = true }
croquis-solver = { workspace = true }
croquis-extraction = { workspace = true }
croquis-data = { workspace = true }
croquis-eval = { workspace = true }
croquis-assets = { workspace = true }

[tool.uv.workspace]
members = ["packages/scene-schema/python", "solver", "extraction", "data", "eval", "assets/pipeline"]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "hypothesis>=6.169.2,<7",
  # Solo referencia en pruebas y evaluaciones; el solver no depende de SciPy (ADR 0027).
  "scipy>=1.18,<2",
  "ruff>=0.17,<0.18",
  "pyright>=1.1.414,<2",
  "datamodel-code-generator>=0.83,<1",
]

[tool.pytest.ini_options]
testpaths = ["packages/scene-schema/python/tests", "solver/tests", "extraction/tests", "data/tests", "eval/tests", "assets/pipeline/tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["data/raw", "data/processed", "eval/results", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PT", "ARG", "PIE", "RET", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG", "PT011"]
"**/scripts/**" = ["T20"]
"**/__main__.py" = ["T20"]
"extraction/croquis_extraction/validate_ciss.py" = ["T20"]
"**/generated.py" = ["E501", "N815", "UP"]
# Tablas de expresiones regulares en español: partirlas las vuelve ilegibles.
"extraction/croquis_extraction/baseline.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["croquis_scene_schema", "croquis_solver", "croquis_extraction", "croquis_data", "croquis_eval", "croquis_assets"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["packages/scene-schema/python", "solver", "extraction", "data", "eval", "assets/pipeline"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "data/raw", "data/processed", "eval/results"]
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "warning"
