[project]
name = "croquis-eval"
version = "0.1.0"
description = "Evaluaciones E1–E9: scripts reproducibles cuyas salidas versionadas alimentan el README"
requires-python = ">=3.14"
dependencies = [
  "croquis-solver",
  "croquis-data",
  "croquis-extraction",
  "numpy>=2.5,<3",
  "polars>=2.0,<3",
  "scipy>=1.18,<2",
]

[tool.uv.sources]
croquis-solver = { workspace = true }
croquis-data = { workspace = true }
croquis-extraction = { workspace = true }

[project.scripts]
croquis-eval = "croquis_eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_eval"]
