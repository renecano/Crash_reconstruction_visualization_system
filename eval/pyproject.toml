[project]
name = "croquis-eval"
version = "0.1.0"
description = "Evaluaciones E1–E9: scripts reproducibles cuyas salidas versionadas alimentan el README"
requires-python = ">=3.14"
dependencies = [
  "croquis-solver",
  "numpy>=2.5,<3",
]

[tool.uv.sources]
croquis-solver = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_eval"]
