[project]
name = "croquis-data"
version = "0.1.0"
description = "Descarga e ingesta reproducible de datos externos (INEGI ATUS, NHTSA, fricción)"
requires-python = ">=3.14"
dependencies = [
  "polars>=2.0,<3",
  "httpx>=0.28,<1",
]

[project.scripts]
croquis-data = "croquis_data.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_data"]
