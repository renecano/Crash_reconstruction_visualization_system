texto = """
La moto se me cayó antes de llegar a la camioneta, eso que quede claro. Iba por la avenida Juárez en Ciudad Juárez, bueno, por la 16 de Septiembre, en mi moto, la Pulsar. Una camioneta blanca se frenó de golpe adelante de mí, frené, se me barrió la llanta de atrás y me caí; la moto se fue raspando unos seis metros y terminó pegándole en la defensa trasera. Yo quedé en el piso, con el casco puesto. Iba como a 45.
