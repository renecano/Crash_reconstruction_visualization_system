Declaro que el día 12 de septiembre, alrededor de las 22:30 horas, conducía mi camioneta Nissan NP300 sobre la carretera federal 57, tramo San Luis Potosí-Matehuala, a una velocidad aproximada de 90 km/h, cuando un tractocamión que intentaba rebasarme golpeó con su costado la parte trasera izquierda de mi unidad. A consecuencia de ello perdí el control y la camioneta se volcó, quedando sobre su toldo en el acotamiento. Los peritos señalaron marcas de raspado de aproximadamente 9 metros sobre el pavimento, producidas tras el impacto. El tramo carece de alumbrado público. Viajaba solo y portaba el cinturón de seguridad.
