tipo = "moto"
registro = "coloquial"
texto = """
Venía en mi Italika por avenida Tecnológico en Metepec, como a 50, y una Ecosport gris que venía de frente se dio vuelta a la izquierda sin fijarse. Le pegué en la puerta del copiloto, salí volando y la moto se fue arrastrando como ocho metros hasta la banqueta. Traía casco y chamarra, nomás me raspé la rodilla.
"""
