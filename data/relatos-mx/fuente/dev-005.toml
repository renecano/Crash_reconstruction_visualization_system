Reporte de siniestro. El conductor de la unidad asegurada, una van de carga Ford Transit color blanco, manifiesta que circulaba de noche sobre la carretera federal 200, en el tramo Pinotepa Nacional a Puerto Escondido, Oaxaca, a una velocidad aproximada de 70 km/h. Refiere que al tomar una curva a la derecha encontró el pavimento cubierto de lodo por un deslave reciente, perdió el control y la unidad impactó con su frente contra un muro de contención del lado izquierdo de la vía. Se observaron marcas de derrape de aproximadamente 12 metros. El conductor portaba cinturón de seguridad y no requirió atención médica. El tramo carece de alumbrado público.
"""
