id = "rmx-t040"
tipo = "moto"
registro = "formal"
texto = """
Comparezco para manifestar que el día 9 de octubre, aproximadamente a las 20:15 horas, conducía mi motocicleta Italika color negro sobre la calle 20 de Noviembre, en la ciudad de Durango, con dirección al oriente, a una velocidad de 40 km/h, llevando como acompañante a {{sexo:mi esposa|mi esposo}}. En la intersección con la calle Zaragoza, un vehículo tipo pickup que circulaba de norte a sur no respetó la luz roja del semáforo y nos impactó en el costado izquierdo, por lo que ambos caímos al pavimento. {{sexo:Mi esposa|Mi esposo}} fue {{sexo:trasladada|trasladado}} al hospital para su valoración. Ambos portábamos casco. Mi RFC es [[RFC:MOAR850314KT2]].
"""
[relato.hechos]
"lugar.tipo_via" = ["interseccion", "intersección con la calle Zaragoza"]
"entorno.iluminacion" = ["noche", "20:15 horas"]
"evento.tipo" = ["impacto_vehiculo_vehiculo", "nos impactó en el costado izquierdo"]
dispositivos = [["semaforo", "semáforo"]]
zonas = { "0" = ["L", "costado izquierdo"], "1" = ["F"] }
[[relato.hechos.vehiculos]]
