texto = """
Bajando por la avenida Domingo Diez en Cuernavaca, que está bien empinada, el carro de adelante se paró en el semáforo y yo frené, pero {{sexo:una señora|un señor}} que venía atrás de mí en una Urvan del transporte no alcanzó a frenar y me dio un llegue por atrás. Me empujó y casi le pego al de adelante. Yo iba en el Aveo de mi papá. {{sexo:La señora|El señor}} se bajó y luego luego dijo que se le habían ido los frenos.
"""
