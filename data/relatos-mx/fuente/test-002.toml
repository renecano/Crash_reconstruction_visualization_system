tipo = "moto"
registro = "formal"
texto = """
Yo, [[NOMBRE:Xóchitl Ramírez Nava]], con CURP [[CURP:RANX960721MPLMVC08]], declaro que el día 11 de octubre, aproximadamente a las 09:15 horas, conducía mi motocicleta sobre la avenida Independencia de la ciudad de Tlaxcala con dirección al centro, a una velocidad aproximada de 35 km/h, portando casco. Un {{vehiculo:automóvil compacto|autobús de transporte público}} que circulaba delante de mí se detuvo de manera repentina sin que encendieran sus luces de freno, por lo que no me fue posible frenar a tiempo e impacté su parte trasera. Caí sobre el pavimento y presenté una lesión leve en la rodilla. El piso se encontraba seco.
"""
