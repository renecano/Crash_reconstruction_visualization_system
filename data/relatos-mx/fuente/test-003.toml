tipo = "objeto"
registro = "formal"
texto = """
Declaro que el día 5 de octubre, alrededor de las 23:40 horas, conducía mi vehículo Hyundai Tucson color vino sobre el bulevar Tamaulipas, en Ciudad Victoria, acompañado de mi {{sexo:esposa|esposo}}, quien viajaba en el asiento del copiloto con el cinturón colocado. Circulaba por el carril izquierdo a una velocidad aproximada de 50 km/h; el pavimento presentaba encharcamientos derivados de la lluvia intensa, lo que ocasionó que el vehículo perdiera adherencia y se impactara de costado contra el muro de contención del camellón central. El impacto se produjo del lado del conductor. Ninguno de los ocupantes resultó lesionado.
"""
