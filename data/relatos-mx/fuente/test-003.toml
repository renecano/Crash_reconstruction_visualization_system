tipo = "vv"
registro = "coloquial"
texto = """
Ayer como a las 10 de la noche bajaba por avenida Vallarta en Guadalajara, en mi {{vehiculo:Corolla|Sentra}}, y en el cruce con Chapultepec un taxi se pasó el rojo y me dio un llegue en la salpicadera delantera del lado derecho. Yo traía el verde e iba como a cuarenta, tranquilo. Hay buen alumbrado ahí, se veía todo. El taxista ni se bajó, se arrancó y se fue.
"""
