Yo iva manejando mi Trailblazer derecho por la calle Hidalgo, ya iba tarde al trabajo, y de repente tenia enfrente a {{sexo:un muchacho|una muchacha}} que iva en su bici. Le pege con el frente y se cayo al piso. Me baje luego luego a {{sexo:ayudarlo|ayudarla}}, se quejaba de la pierna y yo le hable a la ambulansia. Llego la patruya y luego el del seguro. Gracias a dios no fue nada grave pero yo todabia estoy bien nerviosa.
"""
