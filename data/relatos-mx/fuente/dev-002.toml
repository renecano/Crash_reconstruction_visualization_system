tipo = "vv"
registro = "coloquial"
texto = """
Ayer en avenida Constitución, en Monterrey, iba en mi Corolla como a sesenta por el carril de en medio. Un camión urbano se salió de la parada sin fijarse y me echó lámina del lado derecho, me rayó toda la puerta de atrás. Yo le pité pero ni caso. Eran como las seis y media y ya estaba pardeando.
"""
