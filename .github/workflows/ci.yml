name: CI

# Lo que cuenta para hacer merge (CLAUDE.md, ADR 0047): lint, tipos, pruebas unitarias de lógica y
# cálculos, y una e2e por flujo principal en Chromium; todo en menos de 10 minutos. Lo demás
# (otros navegadores, capturas de referencia, E8, la reproducibilidad de los datos y los generados)
# vive en `completo.yml` y corre a mano: cuando René lo pide o antes de una demo con CESVI.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web y paquetes TS (lint, tipos, pruebas unitarias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ningún video ni audio en el repositorio fuera de la portada (René, 2026-11-17).
      - run: node tools/git/sin-medios.mjs
      # Ningún carácter de control (un CR real en lugar de «\r») dentro de una línea de un script
      # (René, 2026-11-17: la demo local falló en la computadora del colaborador).
      - run: node tools/git/sin-control.mjs
      # Las pruebas de tools/: el candado y qué cambios despliegan el sitio (tools/vercel).
      - run: pnpm --filter @croquis/web exec vitest run --root ../.. --dir ../../tools --environment node
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Sin las reconstrucciones completas de la web: van en su job, en paralelo (`pesadas`).
      - run: pnpm test
        env:
          CROQUIS_PRUEBAS: ligeras
      # Zod, los tipos C# y los paquetes caso-3d, al día con los esquemas (ADR 0111).
      - run: pnpm --filter @croquis/scene-schema generate:check
      # Los generados de la web, al día con sus fuentes: datos de las páginas (eval/results), tokens e
      # íconos de la marca, imagen para redes y fuente (auditoría del 2026-11-15, I4).
      - run: pnpm --filter @croquis/web generate:check

  pesadas:
    # Las pruebas de cálculo que reconstruyen casos completos (los ejemplos, AXA, la velocidad del
    # perito, el rango del solver): en paralelo con el job web, para que ninguno pase de 10 minutos
    # (René, 2026-11-28: el job web llegó al tope con todas juntas). La lista, en apps/web/vitest.config.ts.
    name: Reconstrucciones de los ejemplos (pruebas de cálculo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @croquis/web exec vitest run
        env:
          CROQUIS_PRUEBAS: pesadas

  visor:
    name: Visor Unity (Croquis.Core, fidelidad)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # D2 (plan v4 §1): la pose y el daño contra el Resultado, sin Unity ni licencia.
      - run: dotnet test apps/visor-unity/tests/Croquis.Core.Tests -c Release

  e2e:
    name: E2E de los flujos principales (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # La imagen oficial de Playwright ya trae Chromium y sus paquetes del sistema: sin ella, el
    # paso de apt de `--with-deps` llegó a tardar más de 8 min (2026-10-22) y cortaba el trabajo.
    # Su versión va con la de @playwright/test del catálogo (pnpm-workspace.yaml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Una prueba por flujo principal, marcada con @flujo en su título.
      - run: pnpm --filter @croquis/web exec playwright test --project=chromium --grep @flujo --pass-with-no-tests
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Las pruebas de Python van en dos tareas en paralelo para que CI siga bajo 10 minutos: con W8 la
  # inversión hace más trabajo y una sola tarea pasaba del límite (2026-11-14). Se corren todas; solo
  # se reparten. `worksteal` reparte la cola de las pruebas largas entre los procesos libres.
  python:
    name: Python (ruff, pyright, pytest ${{ matrix.parte }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Los resultados versionados del solver, en dos mitades con la misma carga
          # (`CROQUIS_RESULTADOS`, 2026-11-27: juntos pasaban de 10 min), y la extracción. Los
          # nombres «1/2» y «2/2» son los que pide la regla de `main`; la otra mitad va aparte.
          - parte: "1/2"
            resultados: "1/2"
            pruebas: >-
              solver/tests/test_results_io.py extraction/tests
          - parte: "referencias 2/2"
            resultados: "2/2"
            pruebas: >-
              solver/tests/test_results_io.py
          # El resto del solver y lo demás.
          - parte: "2/2"
            resultados: ""
            pruebas: >-
              solver/tests --ignore=solver/tests/test_results_io.py
              packages/scene-schema/python/tests data/tests eval/tests
              assets/pipeline/tests tools/blender/tests
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-groups --locked
      - if: matrix.parte == '1/2'
        run: uv run ruff check .
      - if: matrix.parte == '1/2'
        run: uv run ruff format --check .
      - if: matrix.parte == '2/2'
        run: uv run pyright
      - run: uv run pytest -n auto --dist worksteal ${{ matrix.pruebas }}
        env:
          CROQUIS_RESULTADOS: ${{ matrix.resultados }}
