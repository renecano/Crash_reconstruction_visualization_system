name: CI

# Lo que cuenta para hacer merge (CLAUDE.md, ADR 0047): lint, tipos, pruebas unitarias de lógica y
# cálculos, y una e2e por flujo principal en Chromium; todo en menos de 10 minutos. Lo demás
# (otros navegadores, capturas de referencia, E8, la reproducibilidad de los datos y los generados)
# vive en `completo.yml` y corre a mano: cuando René lo pide o antes de una demo con CESVI.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web y paquetes TS (lint, tipos, pruebas unitarias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: E2E de los flujos principales (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # La imagen oficial de Playwright ya trae Chromium y sus paquetes del sistema: sin ella, el
    # paso de apt de `--with-deps` llegó a tardar más de 8 min (2026-10-22) y cortaba el trabajo.
    # Su versión va con la de @playwright/test del catálogo (pnpm-workspace.yaml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Una prueba por flujo principal, marcada con @flujo en su título.
      - run: pnpm --filter @croquis/web exec playwright test --project=chromium --grep @flujo --pass-with-no-tests
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
