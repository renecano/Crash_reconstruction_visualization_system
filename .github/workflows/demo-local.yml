# La demo local (CORRER-DEMO-LOCAL.bat y .command; LEEME-DEMO-LOCAL.md) en una Mac de verdad con
# Apple Silicon (el runner macos-14 de GitHub) y en Linux. Revisa los scripts con shellcheck, prepara
# la demo como lo haría el doble clic (dependencias, el visor de Unity del release de GitHub y la
# compilación en modo local) y comprueba con curl que el sitio sirve el visor y los modelos desde la
# máquina. Lo que no puede probar: el doble clic en Finder, el aviso de macOS la primera vez y abrir
# Chrome con su ventana.
name: Demo local

on:
  pull_request:
    paths:
      - "CORRER-DEMO-LOCAL.*"
      - "tools/demo-local/**"
      - "tools/unity/visor-local.mjs"
      - ".github/workflows/demo-local.yml"
  workflow_dispatch:

concurrency:
  group: demo-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck de los scripts de la demo local
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --shell=bash CORRER-DEMO-LOCAL.command tools/demo-local/demo-local.sh

  mac:
    name: Demo local en una Mac con Apple Silicon (preparar y humo)
    needs: shellcheck
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Es una Mac con Apple Silicon
        run: |
          uname -m
          test "$(uname -m)" = "arm64"
      - name: Preparar (como el doble clic, sin servir)
        run: bash CORRER-DEMO-LOCAL.command --solo-preparar < /dev/null
      - name: Segunda vez, ya compilada (debe arrancar sin compilar)
        run: bash tools/demo-local/demo-local.sh --solo-preparar | tee segunda.log && grep -q "Ya está compilada" segunda.log
      - name: Humo (sirve y comprueba con curl que nada sale de Blob)
        run: bash tools/demo-local/demo-local.sh --humo
