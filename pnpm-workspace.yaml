packages:
  - apps/*
  - packages/*
  - eval/js

allowBuilds:
  esbuild: true
  # Dependencia de @serwist/turbopack: su binario llega por dependencias opcionales (ADR 0030).
  "@swc/core": false
  sharp: false
  unrs-resolver: false

# Versiones compartidas del monorepo. Fuente de verdad: docs/adr/0001-stack.md
catalog:
  "@dimforge/rapier3d-deterministic-compat": 0.21.0
  "@eslint/js": 10.0.1
  "@react-three/fiber": 9.8.1
  "@types/three": 0.186.0
  three: 0.186.1
  "@playwright/test": 1.64.0
  "@tailwindcss/turbopack": 4.3.3
  "@testing-library/react": 16.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  eslint: 10.12.0
  fast-check: 4.10.2
  jsdom: 30.1.2
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  vite: 8.3.4
  vitest: 5.0.3
  zod: 4.6.5

  "@anthropic-ai/sdk": 0.133.0
  "@noble/hashes": 2.4.0
  "@upstash/ratelimit": 2.2.0
  "@upstash/redis": 1.39.0
  ajv: 8.20.0
  ajv-formats: 3.0.1
  json-schema-to-zod: 2.8.1
  tsx: 4.23.15

minimumReleaseAgeExclude:
  - prettier@3.9.10
