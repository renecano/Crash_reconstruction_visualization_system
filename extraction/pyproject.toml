[project]
name = "croquis-extraction"
version = "0.1.0"
description = "Comprensión del relato: redactor PII, extracción con Claude, verificador y preguntas"
requires-python = ">=3.14"
dependencies = [
  "anthropic>=1.13,<2",
  "pydantic>=2.14,<3",
  "jsonschema>=4.26,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_extraction"]
