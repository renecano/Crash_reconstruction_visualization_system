[project]
name = "croquis-extraction"
version = "0.1.0"
description = "Comprensión del relato: redactor PII, extracción con Claude, verificador y preguntas"
requires-python = ">=3.14"
dependencies = [
  "croquis-scene-schema",
  "croquis-solver",
  "anthropic>=1.13,<2",
  "pydantic>=2.14.1,<3",
  "jsonschema>=4.26,<5",
]

[project.scripts]
croquis-extraction = "croquis_extraction.__main__:main"

[tool.uv.sources]
croquis-scene-schema = { workspace = true }
croquis-solver = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_extraction"]
