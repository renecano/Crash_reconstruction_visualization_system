[project]
name = "croquis-scene-schema"
version = "0.1.0"
description = "Contrato EscenaSpec en Python: modelos Pydantic generados desde escena.schema.json, validación y migraciones"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.14.1,<3",
  "jsonschema>=4.26,<5",
  "rfc3339-validator>=0.1.4,<1",
]

[project.scripts]
croquis-scene-schema-generate = "croquis_scene_schema_codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_scene_schema", "croquis_scene_schema_codegen"]
