[project]
name = "croquis-solver"
version = "0.1.0"
description = "Solver de referencia de reconstrucción de percances viales (Python)"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.5,<3",
  "scipy>=1.18,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_solver"]
