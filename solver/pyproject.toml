[project]
name = "croquis-solver"
version = "0.1.0"
description = "Solver de referencia de reconstrucción de percances viales (Python)"
requires-python = ">=3.14"
dependencies = [
  "croquis-scene-schema",
  "numpy>=2.5,<3",
  "scipy>=1.18,<2",
]

[tool.uv.sources]
croquis-scene-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["croquis_solver"]
